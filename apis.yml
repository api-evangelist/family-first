name: Family First
description: Family First is an employee caregiving benefits provider that pairs certified
  Care Experts with a Care Hub mobile app to support working caregivers. The platform
  helps employers, health plans, and small businesses deliver caregiving advocacy,
  backup and subsidized care, and expert guidance across aging-parent care, mental
  health, chronic illness, caregiver burnout, fertility, childcare, veterans support,
  end-of-life planning, and financial and legal planning. The company operates under
  SOC 2 Type II, HITRUST i1, HIPAA, CCPA, and GDPR frameworks and is Techstars-backed.
  Family First does not publish a public developer API, SDKs, or developer portal;
  this profile captures its public identity, legal, and security posture.
